[workspace]
resolver = "3"
members = ["crates/cpan-overlay-core", "crates/cpan-overlay-compute"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Graham Ollis <plicease@cpan.org>"]
repository = "https://github.com/uperl/rust-cpan-overlay"
license = "MIT"

[workspace.dependencies]
cpan-overlay-core = { path = "crates/cpan-overlay-core", version = "0.1.0" }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
